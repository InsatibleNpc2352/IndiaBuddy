user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    limit_req_zone $binary_remote_addr zone=general_rate:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=search_rate:10m rate=5r/m;

    server {
        listen 80;
        server_name _;
        
        # SSL termination handled by Cloudflare, so we receive HTTP traffic 
        # that Cloudflare proxied, but just in case for internal SSL:
        # listen 443 ssl http2;
        # ssl_certificate /etc/nginx/ssl/cert.pem;
        # ssl_certificate_key /etc/nginx/ssl/key.pem;

        include /etc/nginx/security-headers.conf;

        # Block SQL injection attempts and common exploits in URI
        if ($request_uri ~* "(union.*select.*\(|concat.*\(|select.*from|insert.*into|update.*set|delete.*from|truncate|drop.*table)") {
            return 403;
        }

        if ($request_uri ~* "\.(sh|pl|py|cgi|asp|aspx|jsp|php|inc)$") {
            return 403;
        }

        location /api/search/ {
            limit_req zone=search_rate burst=2 nodelay;
            proxy_pass http://backend:8000/api/search/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=general_rate burst=10 nodelay;
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
