services:
  - type: web
    name: indiabuddy-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements-deploy.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: .
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./indiabuddy.db
      - key: REDIS_URL
        value: redis://localhost:6379/0
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 15
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: CORS_ORIGINS
        value: '["https://frontend-steel-xi-11.vercel.app","http://localhost:3000"]'
      - key: NEWSAPI_KEY
        sync: false
      - key: GHOST_BROWSER_URL
        value: http://localhost:8001
      - key: RATE_LIMIT_PER_MINUTE
        value: 60
      - key: DAILY_REPORT_HOUR
        value: 6