version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
    networks:
      - indiabuddy-net
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    networks:
      - indiabuddy-net
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    networks:
      - indiabuddy-net
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://indiabuddy:postgres@db:5432/indiabuddy}
      - REDIS_URL=${REDIS_URL:-redis://:redis@redis:6379/0}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - NEWSAPI_KEY=${NEWSAPI_KEY}
      - GHOST_BROWSER_URL=http://ghost-browser:8001
      - PROXY_LIST=${PROXY_LIST:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-["https://indiabuddy.in"]}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DAILY_REPORT_HOUR=${DAILY_REPORT_HOUR:-6}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
      - MAX_GHOST_BROWSER_POOL_SIZE=${MAX_GHOST_BROWSER_POOL_SIZE:-3}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ghost-browser:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  ghost-browser:
    build:
      context: ./ghost-browser
    networks:
      - indiabuddy-net
    # NOT exposed to host — internal only
    environment:
      - MAX_GHOST_BROWSER_POOL_SIZE=${MAX_GHOST_BROWSER_POOL_SIZE:-3}
      - DISPLAY=:99
    volumes:
      - ghost_sessions:/app/sessions
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8001/health"]
      interval: 30s
      timeout: 15s
      retries: 3
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    networks:
      - indiabuddy-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-indiabuddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-indiabuddy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-indiabuddy}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - indiabuddy-net
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis} --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  indiabuddy-net:
    driver: bridge
    internal: false   # nginx can reach outside; ghost-browser can't (no port mapping)

volumes:
  postgres_data:
  ghost_sessions:   # persists browser sessions across restarts
